name: drizzle
description: "A modern, minimal weather application built with Flutter."
publish_to: 'none' 
version: 1.0.3+4

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # HTTP client for API calls
  http: ^1.2.0
  
  # Location services
  geolocator: ^12.0.0
  
  # Local storage
  shared_preferences: ^2.2.2
  
  # State management
  provider: ^6.1.1

  # Opening the project page and release notes from the app
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  
  # Testing dependencies
  mockito: ^5.4.4
  build_runner: ^2.4.8
  
  # Launcher icons
  flutter_launcher_icons: ^0.13.1


flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/logo_ios.png"

  windows:
    generate: true
    image_path: "assets/logo_ios.png"

  macos:
    generate: true
    image_path: "assets/logo_ios.png"

  linux:
    generate: true
    image_path: "assets/logo_ios.png"

  image_path_ios: "assets/logo_ios.png"
  image_path_android: "assets/logo.png"
  adaptive_icon_background: "#2196F3"
  adaptive_icon_foreground: "assets/logo.png"
  remove_alpha_ios: true
