name: drizzle
description: "A modern, minimal weather application built with Flutter."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # HTTP client for API calls
  http: ^1.2.0
  
  # Location services
  geolocator: ^12.0.0
  
  # Local storage
  shared_preferences: ^2.2.2
  
  # State management
  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  
  # Testing dependencies
  mockito: ^5.4.4
  build_runner: ^2.4.8


flutter:
  uses-material-design: true
